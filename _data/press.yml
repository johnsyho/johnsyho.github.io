# Press coverage, rendered by _pages/press.md (newest first).
#
#   image     path under assets/img/ (square-ish; cropped to a square)
#   quote     the headline shown on the card; quote_by names the outlet it came from,
#             and must match one of the outlets in `coverage` (the quote links there)
#   paper     the publication the coverage is about (optional)
#   coverage  one entry per article. `archived: true` means the original link died and
#             `url` points to a Wayback Machine copy instead.
#
# Link check 2026-11-13: dropped Stanford Report 2012 ("tiny, wirelessly powered cardiac
# device") and its EurekAlert release, which are dead with no archived copy.

